<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tobi & Nox · Les jeux</title>
<meta name="description" content="Trois mini-jeux dans l'univers de Tobi et Nox : attrape les pièces avec Nox, survis à la fin du mois, et dis non aux idées de Tobi.">
<meta property="og:title" content="Tobi & Nox · Les jeux">
<meta property="og:description" content="Bats mon score. Trois mini-jeux gratuits, sans inscription.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Couleurs de la série : la nuit de la chambre, le jaune de Nox, le moutarde du sweat de Tobi. */
:root { --nuit:#0b0a18; --nuit2:#15132b; --carte:#1c1a36; --trait:#2f2b55; --encre:#f4f1ec; --doux:#a9a5c6; --nox:#f2b92e; --ok:#5ccb74; --non:#ff5f57; --bleu:#8feaff; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { margin:0; background:radial-gradient(120% 90% at 50% 0%, #241f4d 0%, var(--nuit) 60%); color:var(--encre); font-family:Inter, "Segoe UI", sans-serif; overflow-x:hidden; }
h1, h2, .big { font-family:Fraunces, Georgia, serif; }
button { font:inherit; color:inherit; cursor:pointer; border:0; }
.wrap { max-width:980px; margin:0 auto; padding:20px 16px 48px; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
header h1 { font-size:clamp(26px, 5vw, 40px); margin:0; letter-spacing:-.01em; }
header h1 span { color:var(--nox); }
.pill { display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; background:var(--carte); border:1px solid var(--trait); font-weight:600; font-size:14px; text-decoration:none; color:var(--encre); }
.pill.main { background:var(--nox); color:#1a1405; border-color:transparent; }
.lead { color:var(--doux); margin:10px 0 22px; max-width:56ch; line-height:1.5; }
.defi { display:none; margin:0 0 18px; padding:14px 16px; border-radius:16px; background:linear-gradient(90deg, rgba(242,185,46,.18), rgba(242,185,46,.04)); border:1px solid rgba(242,185,46,.5); font-weight:600; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; }
.card { position:relative; text-align:left; padding:20px; border-radius:22px; background:linear-gradient(160deg, #24214a, var(--carte)); border:1px solid var(--trait); overflow:hidden; transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s; }
.card:hover, .card:focus-visible { transform:translateY(-4px); border-color:var(--nox); outline:none; }
.card .ico { font-size:44px; line-height:1; display:block; margin-bottom:12px; }
.card h2 { margin:0 0 6px; font-size:24px; }
.card p { margin:0 0 14px; color:var(--doux); line-height:1.45; font-size:15px; }
.card .best { font-size:13px; color:var(--nox); font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
.card .go { position:absolute; right:16px; bottom:16px; width:44px; height:44px; border-radius:50%; background:var(--nox); color:#1a1405; display:grid; place-items:center; font-size:20px; font-weight:800; }
footer { margin-top:28px; color:var(--doux); font-size:13px; }
footer a { color:var(--nox); }

/* Écran de jeu : plein écran, par-dessus l'accueil. */
.stage { position:fixed; inset:0; background:var(--nuit); display:none; flex-direction:column; z-index:10; }
.stage.on { display:flex; }
.bar { display:flex; align-items:center; gap:10px; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); background:rgba(11,10,24,.72); border-bottom:1px solid var(--trait); }
.bar .back { background:var(--carte); border:1px solid var(--trait); border-radius:12px; padding:9px 12px; font-weight:600; font-size:14px; }
.bar .title { font-family:Fraunces, serif; font-weight:800; font-size:18px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hud { display:flex; gap:14px; align-items:center; font-weight:800; font-variant-numeric:tabular-nums; }
.hud b { color:var(--nox); font-size:22px; }
.hud small { color:var(--doux); font-weight:600; font-size:12px; display:block; line-height:1; }
.play { position:relative; flex:1; min-height:0; overflow:hidden; }
canvas#gl { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.toast { position:absolute; left:50%; top:14px; transform:translate(-50%,-12px); padding:10px 16px; border-radius:14px; background:rgba(28,26,54,.92); border:1px solid var(--trait); font-weight:600; font-size:15px; opacity:0; transition:opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.3); pointer-events:none; max-width:90%; text-align:center; }
.toast.on { opacity:1; transform:translate(-50%,0); }
.hint { position:absolute; left:0; right:0; bottom:18px; text-align:center; color:var(--doux); font-size:14px; pointer-events:none; }

/* Fin de mois */
.mois { height:100%; display:flex; flex-direction:column; align-items:center; padding:14px 14px 18px; gap:12px; overflow:auto; }
.jauges { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:min(560px, 100%); }
.jauge { background:var(--carte); border:1px solid var(--trait); border-radius:14px; padding:8px 8px 10px; text-align:center; font-size:12px; font-weight:600; color:var(--doux); }
.jauge i { font-style:normal; font-size:20px; display:block; }
.jauge .t { height:8px; border-radius:6px; background:#0f0e22; margin-top:6px; overflow:hidden; }
.jauge .t span { display:block; height:100%; width:50%; background:var(--nox); border-radius:6px; transition:width .45s cubic-bezier(.2,.8,.2,1), background .3s; }
.jauge.bas .t span { background:var(--non); }
.jauge.bouge { animation:secoue .35s; }
@keyframes secoue { 25% { transform:translateX(-4px) } 75% { transform:translateX(4px) } }
.fiche { width:min(560px, 100%); flex:1; min-height:230px; background:linear-gradient(170deg, #f8f4ea, #efe7d6); color:#1d1b2e; border-radius:26px; padding:22px 20px; display:flex; flex-direction:column; justify-content:center; gap:10px; box-shadow:0 24px 60px rgba(0,0,0,.45); transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
.fiche.sort-g { transform:translateX(-120%) rotate(-12deg); opacity:0; }
.fiche.sort-d { transform:translateX(120%) rotate(12deg); opacity:0; }
.fiche .jour { font-weight:800; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#8b6d12; }
.fiche .txt { font-family:Fraunces, serif; font-weight:600; font-size:clamp(20px, 4.6vw, 27px); line-height:1.25; }
.fiche .nox { margin-top:6px; padding:10px 12px; border-radius:14px; background:#1d1b2e; color:var(--nox); font-weight:600; font-size:15px; min-height:42px; }
.choix { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(560px, 100%); }
.choix button { padding:16px 12px; border-radius:18px; background:var(--carte); border:1px solid var(--trait); font-weight:800; font-size:15px; line-height:1.25; min-height:64px; transition:transform .12s, border-color .12s, background .12s; }
.choix button:active { transform:scale(.97); }
.choix button:hover { border-color:var(--nox); }

/* Tobi. Non. */
.non { height:100%; display:flex; flex-direction:column; align-items:center; padding:14px; gap:12px; }
.temps { width:min(620px, 100%); height:10px; border-radius:8px; background:var(--carte); overflow:hidden; }
.temps span { display:block; height:100%; width:100%; background:linear-gradient(90deg, var(--nox), #ff9a3c); transform-origin:left; }
.plateau { flex:1; width:min(620px, 100%); display:grid; grid-template-columns:repeat(2, 1fr); grid-auto-rows:1fr; gap:10px; min-height:0; }
.idee { position:relative; border-radius:20px; background:var(--carte); border:1px solid var(--trait); display:grid; place-items:center; padding:12px; text-align:center; font-weight:800; font-size:clamp(14px, 3.6vw, 18px); line-height:1.2; opacity:.25; transition:opacity .15s, transform .15s cubic-bezier(.2,.9,.3,1.4), background .15s; user-select:none; }
.idee.vive { opacity:1; transform:scale(1.02); background:linear-gradient(160deg, #2c2860, #1f1c43); border-color:#4b45a0; }
.idee .cercle { position:absolute; left:10px; top:10px; width:22px; height:22px; border-radius:50%; border:3px solid var(--nox); border-right-color:transparent; opacity:0; }
.idee.vive .cercle { opacity:1; animation:tourne linear forwards; }
@keyframes tourne { to { transform:rotate(360deg); } }
.idee.bien { background:rgba(92,203,116,.28); border-color:var(--ok); }
.idee.mal { background:rgba(255,95,87,.28); border-color:var(--non); animation:secoue .3s; }

/* Fin de partie */
.fin { position:absolute; inset:0; background:rgba(11,10,24,.86); display:none; place-items:center; padding:18px; z-index:5; }
.fin.on { display:grid; animation:monte .3s cubic-bezier(.2,.8,.2,1); }
@keyframes monte { from { opacity:0; transform:translateY(14px) } }
.fin .boite { width:min(420px, 100%); background:linear-gradient(160deg, #26224f, var(--carte)); border:1px solid var(--trait); border-radius:26px; padding:24px 20px; text-align:center; }
.fin .big { font-size:64px; font-weight:800; color:var(--nox); line-height:1; }
.fin .lib { color:var(--doux); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-top:4px; }
.fin .mot { margin:14px 0 6px; font-family:Fraunces, serif; font-size:21px; font-weight:600; line-height:1.3; }
.fin .rec { color:var(--nox); font-weight:800; min-height:20px; }
.fin .btns { display:grid; gap:10px; margin-top:16px; }
.fin .btns button { padding:14px; border-radius:16px; font-weight:800; font-size:16px; background:var(--carte); border:1px solid var(--trait); }
.fin .btns button.main { background:var(--nox); color:#1a1405; border-color:transparent; }
@media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="wrap" id="accueil">
  <header>
    <h1>Tobi <span>&</span> Nox · Les jeux</h1>
    <a class="pill main" href="https://www.youtube.com/@tobietnox" target="_blank" rel="noopener">▶ Voir les Shorts</a>
  </header>
  <p class="lead">Trois mini-jeux dans la chambre de Tobi. Gratuits, sans inscription. Fais un score, puis envoie ton défi à un ami.</p>
  <div class="defi" id="defi"></div>
  <div class="grid" id="cartes"></div>
  <footer>Une série de Shorts animés : Tobi, étudiant fauché, et Nox, son IA. <a href="./">Le Studio</a> · <a href="https://www.youtube.com/@tobietnox" target="_blank" rel="noopener">La chaîne YouTube</a></footer>
</div>

<div class="stage" id="stage">
  <div class="bar">
    <button class="back" id="retour">← Jeux</button>
    <div class="title" id="titre"></div>
    <div class="hud" id="hud"></div>
  </div>
  <div class="play" id="play">
    <canvas id="gl"></canvas>
    <div class="toast" id="toast"></div>
    <div class="fin" id="fin"><div class="boite">
      <div class="big" id="finScore">0</div><div class="lib" id="finLib">points</div>
      <div class="mot" id="finMot"></div><div class="rec" id="finRec"></div>
      <div class="btns"><button class="main" id="rejouer">Rejouer</button><button id="partager">Défier un ami</button><button id="autres">Autres jeux</button></div>
    </div></div>
  </div>
</div>
<script type="module">/*BUNDLE*/</script>
</body>
</html>
