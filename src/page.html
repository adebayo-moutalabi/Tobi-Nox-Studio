<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Scène plein cadre, régie à droite comme un pupitre d'animation ; en colonne sur téléphone. */
:root {
  --bg: #e4e3df; --panel: #f4f3ef; --ink: #27272a; --muted: #66645e; --line: #d2d0c9;
  --accent: #e8a33d; --accent-ink: #2a2015; --chip: #e9e7e1; --chip-hover: #dedbd2; --sole: #b95c1c;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b2030; --panel: #222839; --ink: #eceae4; --muted: #a6a59f; --line: #363d52;
  --accent: #e8a33d; --accent-ink: #2a2015; --chip: #2d3448; --chip-hover: #39415a; --sole: #ef9a5c; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1b2030; --panel: #222839; --ink: #eceae4; --muted: #a6a59f; --line: #363d52;
  --accent: #e8a33d; --accent-ink: #2a2015; --chip: #2d3448; --chip-hover: #39415a; --sole: #ef9a5c; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px; margin: 0; padding: 7px 11px; border-radius: 8px; background: rgba(28, 28, 30, .62); color: #f2f1ec; font-size: 12.5px; line-height: 1.4; pointer-events: none; max-width: calc(100% - 32px); }
.hint kbd { font: inherit; font-weight: 600; color: #f6c77c; }
.views { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; flex-wrap: wrap; }
.views button { background: rgba(28, 28, 30, .62); color: #f2f1ec; border: 0; }
.views button:hover { background: rgba(28, 28, 30, .8); }
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.bubble { position: absolute; transform: translate(-50%, -100%); max-width: min(280px, 70%); padding: 8px 12px; background: #fffdf8; color: #27272a; border-radius: 12px; font-size: 14px; line-height: 1.35; box-shadow: 0 2px 10px rgba(0,0,0,.18); pointer-events: none; }
.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 18px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.08; margin: 0 0 5px; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); line-height: 1.45; }
h2 { font-family: var(--display); font-weight: 500; font-size: 15px; margin: 0 0 8px; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-weight: 500; font-size: 13px; padding: 7px 10px; border-radius: 7px; border: 1px solid transparent; background: var(--chip); color: var(--ink); cursor: pointer; transition: background .12s; }
button:hover { background: var(--chip-hover); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sole); outline-offset: 2px; }
.held { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.curtain { position: absolute; inset: 0; background: #0e0f12; opacity: 0; pointer-events: none; }
select { font: inherit; font-size: 13px; padding: 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); }
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #f6f1e6; font-family: var(--display); font-size: clamp(22px, 4vw, 38px); text-align: center; text-wrap: balance; pointer-events: none; max-width: 80%; }
textarea { width: 100%; box-sizing: border-box; margin-top: 8px; font: 12.5px/1.45 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 8px; resize: vertical; }
summary { cursor: pointer; color: var(--muted); margin-top: 8px; }
button:disabled { opacity: .45; cursor: default; }
.app.portrait .stage { aspect-ratio: 9 / 16; height: 100%; max-width: 100%; justify-self: center; }
form { display: flex; gap: 6px; }
input[type="text"] { font: inherit; flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
.send { background: var(--ink); color: var(--panel); }
.send:hover { background: var(--ink); opacity: .86; }
.opts { display: flex; flex-direction: column; gap: 7px; }
.opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.opts input { accent-color: var(--sole); width: 16px; height: 16px; margin: 0; }
.spec { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 54% minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 16px; }
  h1 { font-size: 21px; }
  .hint { display: none; }
}
</style>
<div class="app">
  <main class="stage" id="stage">
    <div class="views" id="views" role="group" aria-label="Vue caméra"></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="curtain" id="curtain"></div>
    <div class="card" id="card" hidden></div>
    <p class="hint"><kbd>Clic au sol</kbd> pour l'envoyer · <kbd>ZQSD</kbd> ou <kbd>flèches</kbd> pour marcher · <kbd>Maj</kbd> pour courir · glisser pour tourner</p>
  </main>
  <aside class="panel">
    <header>
      <h1>{{H1}}</h1>
      <p class="sub">{{SUB}}</p>
    </header>
    <section id="storyBox" hidden>
      <h2>Histoire</h2>
      <div class="grid"><select id="storyPick" aria-label="Choisir un script"></select><select id="storyFormat" aria-label="Format"><option value="short">Short 9:16</option><option value="wide">YouTube 16:9</option></select></div>
      <div class="grid" style="margin-top:6px"><button type="button" id="storyPlay">Lire l'histoire</button><button type="button" id="storyStop" disabled>Arrêter</button><button type="button" id="storyExport">Exporter en MP4</button><select id="storyFps" aria-label="Images par seconde"><option value="30">30 i/s</option><option value="60">60 i/s</option></select></div>
      <div class="opts" style="margin-top:8px"><label><input type="checkbox" id="storyCaps" checked> Sous-titres dans la vidéo</label><label>Voix ElevenLabs, dans l'ordre : <input type="file" id="storyVoices" multiple accept="audio/*"></label></div>
      <p class="sub" id="storyNow" aria-live="polite"></p>
      <details><summary>Modifier le script</summary><textarea id="storyText" rows="14" spellcheck="false" aria-label="Script de l'histoire"></textarea></details>
    </section>
    <section id="castBox" hidden><h2>Piloter</h2><div class="grid" id="cast"></div></section>
    <section id="roomBox" hidden><h2>Dans la chambre</h2><div class="grid" id="roomActs"></div><div class="grid held" id="roomSwitch"></div></section>
    <section id="scenesBox" hidden><h2>Scènes à deux</h2><div class="grid" id="scenes"></div></section>
    <section><h2>Gestes</h2><div class="grid" id="gestures"></div></section>
    <section><h2>Postures</h2><div class="grid" id="postures"></div></section>
    <section>
      <h2>Objets</h2>
      <div class="grid" id="props"></div>
      <div class="grid held" id="held" hidden></div>
    </section>
    <section><h2>Mimiques</h2><div class="grid" id="faces"></div></section>
    <section>
      <h2>Faire parler</h2>
      <form id="say">
        <input id="sayText" type="text" value="{{SAY}}" aria-label="Texte à dire" maxlength="120">
        <button class="send" type="submit">Dire</button>
      </form>
    </section>
    <section class="opts">
{{OPTS}}      <label><input type="checkbox" id="spin"> Rotation automatique</label>
    </section>
    <p class="spec" id="spec"></p>
  </aside>
</div>
<script type="module">
/*BUNDLE*/
</script>
